<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXTATION - Mastering the Pause: The 'Bear with Me' Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        /* src/assets/styles/_variables.scss */
        :root {
            /* Core backgrounds */
            --bg-main: #02030b; /* Page background */
            --bg-gradient: radial-gradient(circle at top, #1c1f3b 0%, #050716 45%, #02030b 100%);
            /* Surfaces / Cards */
            --card-bg: rgba(15, 18, 40, 0.92); /* Lesson panels */
            --card-soft-bg: rgba(18, 21, 50, 0.88); /* Tab cards and navigation buttons */
            /* Neon accents */
            --accent-cyan: #4ef2ff; /* Cyan highlight around edges */
            --accent-pink: #ff2f92; /* Magenta highlight for buttons */
            --accent-green: #4dff9b; /* Success / tab completed mark */
            --accent-yello: #ffe25f; /* Accent blended in text gradients */
            --accent-purple: #aa5dff; /* Hover glows and edges */
            /* Text and borders */
            --muted: rgba(255,255,255,0.65);
            --border-glow: rgba(120,120,255,0.45);
            /* Shadows */
            --shadow-strong: 0 0 36px rgba(130,80,255,0.6);
            --shadow-soft: 0 0 20px rgba(0,0,0,0.65);
            /* Radii and transitions */
            --radius-lg: 22px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --transition-fast: 0.18s ease-out;
            --transition-med: 0.28s ease-out;
        }

        /* src/assets/styles/global.scss */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            background-color: var(--bg-main);
            color: #fff;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        p {
            font-family: 'Montserrat', sans-serif;
        }

        button {
            border: none;
            cursor: pointer;
            transition: all var(--transition-fast);
            outline: none; /* Default outline removal */
        }
        button:focus {
            box-shadow: 0 0 0 3px rgba(78, 242, 255, 0.5);
        }

        input[type="text"], textarea {
            background: rgba(2,6,32,0.95);
            border: 1px solid rgba(178,75,243,0.45);
            border-radius: var(--radius-sm);
            color: #fff;
            padding: 0.8rem 1rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: rgba(178,75,243,0.8);
            box-shadow: 0 0 10px rgba(178,75,243,0.6);
        }
        input[type="text"]::placeholder, textarea::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .no-video {
            border: 1px dashed rgba(255,255,255,0.35);
            color: rgba(255,255,255,0.75);
            padding: 1.5rem;
            border-radius: var(--radius-md);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
        }
        .no-video .emoji {
            font-size: 1.5rem;
        }

        .emoji {
            display: inline-block;
            vertical-align: middle;
            margin-right: 0.3em;
        }

        .tab-content {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .no-content-message {
            color: var(--muted);
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            margin-top: 3rem;
        }

        /* Mixins for buttons - defined directly here for single HTML file */
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-yello), var(--accent-cyan));
            color: var(--bg-main);
            padding: 0.8rem 2rem;
            border-radius: var(--radius-sm);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border: none;
            cursor: pointer;
            transition: all var(--transition-fast);
            box-shadow: 0 0 25px rgba(255, 47, 146, 0.5);
        }
        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 35px rgba(255, 47, 146, 0.7);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--card-soft-bg), var(--bg-main));
            color: rgba(255,255,255,0.85);
            padding: 0.8rem 2rem;
            border-radius: var(--radius-sm);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border: 1px solid rgba(120,120,255,0.3);
            cursor: pointer;
            transition: all var(--transition-fast);
            box-shadow: var(--shadow-soft);
        }
        .btn-secondary:hover {
            transform: translateY(-2px) scale(1.02);
            border-color: var(--accent-purple);
            box-shadow: 0 0 20px rgba(170, 93, 255, 0.4);
        }
        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* LessonView.vue styles */
        .lesson-view {
            min-height: 100vh;
            background: var(--bg-gradient);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .lesson-header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
            z-index: 10;
        }

        .teacher-orb {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 20%, #ffffff, transparent 60%),
                        radial-gradient(circle at 70% 80%, #00fff0, transparent 55%),
                        radial-gradient(circle at 50% 50%, #ff2f92, transparent 65%);
            box-shadow: 0 0 15px rgba(0,255,255,0.7), 0 0 25px rgba(255,0,160,0.55);
            margin: 0 auto 1rem;
            animation: orb-glow 3s infinite alternate ease-in-out;
        }

        @keyframes orb-glow {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(0,255,255,0.7), 0 0 25px rgba(255,0,160,0.55); }
            100% { transform: scale(1.05); box-shadow: 0 0 25px rgba(0,255,255,0.9), 0 0 40px rgba(255,0,160,0.7); }
        }

        .brand-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            text-shadow: 0 0 20px rgba(78, 242, 255, 0.8);
        }

        .brand-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            color: var(--muted);
            margin-top: 0.5rem;
        }

        .lesson-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-strong);
            padding: 2.5rem;
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            position: relative;
            z-index: 5;
        }

        .lesson-title {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, var(--accent-yello), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255, 226, 95, 0.6);
        }

        .lesson-description {
            font-size: 1.1rem;
            text-align: center;
            color: var(--muted);
            margin-bottom: 2rem;
        }

        .tab-navigation {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .tab-item {
            background: var(--card-soft-bg);
            border: 1px solid rgba(120,120,255,0.2);
            border-radius: var(--radius-sm);
            padding: 0.8rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            color: rgba(255,255,255,0.7);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all var(--transition-fast);
            box-shadow: 0 0 10px rgba(0,0,0,0.4);

        .tab-item:hover {
            transform: translateY(-2px);
            border-color: var(--accent-cyan);
            color: white;
            box-shadow: 0 0 15px rgba(78, 242, 255, 0.3);
        }
        .tab-item.active {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            border-color: var(--accent-pink);
            color: white;
            box-shadow: 0 0 20px rgba(255, 47, 146, 0.6);
            transform: translateY(-2px);
        }
        .tab-item.active .tab-number {
            background-color: white;
            color: var(--accent-pink);
        }

        .tab-number {
            background-color: rgba(255,255,255,0.2);
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: bold;
            transition: all var(--transition-fast);
        }

        .tab-content-wrapper {
            background: radial-gradient(circle at top, rgba(255,255,255,0.05), rgba(10,15,35,0.95));
            border: 1px solid rgba(120,120,255,0.2);
            border-radius: var(--radius-md);
            padding: 2rem;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            width: 100%;
        }

        .tab-title {
            font-size: 2rem;
            color: var(--accent-cyan);
            margin-bottom: 1rem;
            text-shadow: 0 0 10px rgba(78, 242, 255, 0.5);
        }

        .tab-description {
            font-size: 1.1rem;
            color: var(--muted);
            margin-bottom: 2rem;
        }

        .lesson-footer {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            margin-top: 2rem;
            gap: 1rem;
        }

        /* Tab1Introduction.vue styles */
        .intro-content {
            padding: 2rem;
        }

        .intro-text {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            color: rgba(255,255,255,0.9);
        }

        .intro-highlight {
            color: var(--accent-yello);
            font-weight: bold;
        }

        .language-toggle {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }

        .language-button {
            background: var(--card-soft-bg);
            border: 1px solid rgba(170,93,255,0.4);
            border-radius: var(--radius-sm);
            padding: 0.7rem 1.5rem;
            color: rgba(255,255,255,0.8);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            text-transform: uppercase;
            transition: all var(--transition-fast);
        }
        .language-button:hover {
            background: var(--accent-purple);
            color: white;
            box-shadow: 0 0 15px rgba(170,93,255,0.6);
        }
        .language-button.active {
            background: var(--accent-purple);
            color: white;
            box-shadow: 0 0 20px rgba(170,93,255,0.8);
            border-color: var(--accent-purple);
        }

        /* Tab2WhenToUse.vue styles */
        .when-to-use-content {
            padding: 2rem;
        }

        .when-to-use-text {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: rgba(255,255,255,0.9);
        }

        .pronunciation-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            background: rgba(15, 18, 40, 0.7);
            border: 1px solid rgba(78, 242, 255, 0.3);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            max-width: 400px;
            margin: 0 auto;
        }

        .pronunciation-text {
            font-family: 'Montserrat', sans-serif;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95rem;
        }

        .play-button {
            background: transparent;
            border: 1px dashed rgba(255, 255, 255, 0.35);
            color: rgba(255, 255, 255, 0.8);
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .play-button:hover {
            border-color: var(--accent-pink);
            color: white;
        }

        /* Tab3Situations.vue styles */
        .situations-content {
            padding: 2rem;
        }

        .situations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .situation-card {
            background: radial-gradient(circle at top, rgba(255,255,255,0.06), rgba(10,15,35,0.96));
            border: 1px solid rgba(120,120,255,0.3);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            box-shadow: 0 0 12px rgba(0,0,0,0.5);
            text-align: left;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast);
        }
        .situation-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(120,120,255,0.6);
        }
        .situation-card h3 {
            font-size: 1.2rem;
            color: var(--accent-yello);
            margin-bottom: 0.8rem;
        }
        .situation-card p {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.8);
            margin-bottom: 0.5rem;
        }
        .situation-card .context {
            font-size: 0.85rem;
            color: var(--muted);
            font-style: italic;
            margin-top: 1rem;
            border-top: 1px dashed rgba(255,255,255,0.1);
            padding-top: 0.8rem;
        }

        /* Tab4Write.vue styles */
        .write-content {
            padding: 2rem;
        }

        .writing-prompt {
            font-size: 1.1rem;
            color: var(--accent-green);
            margin-bottom: 1.5rem;
            font-weight: bold;
        }

        .writing-textarea {
            width: 100%;
            max-width: 700px;
            height: 180px;
            margin: 0 auto;
            display: block;
            resize: vertical;
            font-size: 1rem;
            line-height: 1.8;
            background: rgba(2,6,32,0.95);
            border: 1px solid rgba(178,75,243,0.45);
            border-radius: var(--radius-md);
            padding: 1rem;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }
        .writing-textarea:focus {
            border-color: rgba(178,75,243,0.8);
            box-shadow: 0 0 15px rgba(178,75,243,0.6);
        }

        .char-count {
            margin-top: 0.8rem;
            font-size: 0.9rem;
            color: var(--muted);
            text-align: right;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Tab5BilingualMatch.vue styles */
        .match-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        .column {
            background: var(--card-soft-bg);
            border: 1px solid rgba(170,93,255,0.3);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .column h3 {
            font-size: 1.5rem;
            color: var(--accent-pink);
            margin-bottom: 1rem;
            text-align: center;
        }

        .match-card {
            background: rgba(2,6,32,0.9);
            border: 1px solid rgba(78,242,255,0.3);
            border-radius: var(--radius-sm);
            padding: 0.8rem 1rem;
            margin-bottom: 0.8rem;
            font-family: 'Montserrat', sans-serif;
            color: rgba(255,255,255,0.9);
            transition: all var(--transition-fast);
            cursor: grab;
        }
        .match-card:hover {
            transform: translateX(5px);
            box-shadow: 0 0 15px rgba(255,47,146,0.4);
        }

        .english-card {
            border-color: rgba(78,242,255,0.5);
        }

        .portuguese-card {
            border-color: rgba(255,160,255,0.5);
        }

        /* Tab6ReorderSequence.vue styles */
        .reorder-container {
            padding: 2rem;
            text-align: center;
        }

        .sentence-display {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }

        .word-slot {
            background: rgba(78,242,255,0.1);
            border: 2px dashed rgba(78,242,255,0.6);
            border-radius: var(--radius-sm);
            width: 100px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
        }

        .word-options {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .option-word {
            background: linear-gradient(135deg, rgba(255,47,146,0.3), rgba(78,242,255,0.3));
            border: 1px solid rgba(170,93,255,0.6);
            border-radius: var(--radius-md);
            padding: 0.8rem 1.5rem;
            font-family: 'Space Grotesk', sans-serif;
            color: white;
            cursor: grab;
            transition: all var(--transition-fast);
            box-shadow: 0 0 10px rgba(170,93,255,0.3);
        }
        .option-word:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(170,93,255,0.6);
        }
        .option-word:active {
            cursor: grabbing;
        }

        /* Tab7FillTheBlanks.vue styles */
        .fill-blanks-container {
            padding: 2rem;
            text-align: center;
        }

        .sentence-block {
            background: radial-gradient(circle at top, rgba(255,255,255,0.06), rgba(10,15,35,0.96));
            border: 1px solid rgba(120,120,255,0.3);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 12px rgba(0,0,0,0.5);
        }

        .sentence-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            color: rgba(255,255,255,0.9);
            margin-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .blank-box {
            display: inline-block;
            width: 100px; /* Adjust as needed */
            height: 30px;
            background: rgba(78,242,255,0.1);
            border: 1px dashed rgba(78,242,255,0.6);
            border-radius: var(--radius-sm);
            vertical-align: middle;
        }

        .options-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }

        .option-card {
            background: linear-gradient(135deg, rgba(255,47,146,0.3), rgba(78,242,255,0.3));
            border: 1px solid rgba(170,93,255,0.6);
            border-radius: var(--radius-md);
            padding: 0.6rem 1.2rem;
            font-family: 'Space Grotesk', sans-serif;
            color: white;
            cursor: grab;
            transition: all var(--transition-fast);
            box-shadow: 0 0 8px rgba(170,93,255,0.3);
        }
        .option-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(170,93,255,0.6);
        }
        .option-card:active {
            cursor: grabbing;
        }

        @media (max-width: 768px) {
            .brand-title {
                font-size: 2.5rem;
            }
            .lesson-title {

                flex-direction: column;

</head>
<body>
    <div id="app" class="lesson-view">
        <header class="lesson-header">
            <div class="teacher-orb"></div>
            <h1 class="brand-title">NEXTATION</h1>
            <p class="brand-subtitle">Mastering the Pause: The 'Bear with Me' Guide</p>
        </header>

        <main class="lesson-card">
            <h2 class="lesson-title">Bear with Me</h2>
            <p class="lesson-description">
                A comprehensive guide to using "Bear with me" in professional English, designed for adult ADHD learners.
                Clique em um dos cartões ao lado para iniciar a lição e ver o equivalente em Português.
            </p>

            <nav class="tab-navigation">
                <!-- Tab buttons will be rendered here by JavaScript -->
            </nav>

            <div class="tab-content-wrapper">
                <!-- Tab content will be rendered here by JavaScript -->
            </div>

            <footer class="lesson-footer">
                <button class="btn-secondary">Previous</button>
                <button class="btn-primary">Next</button>
            </footer>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const app = document.getElementById('app');

            // Lesson Data - All content embedded here
            const lessonData = {
                id: "lesson-bear-with-me",
                title: "Bear with Me",
                description: "A comprehensive guide to using 'Bear with me' in professional English, designed for adult ADHD learners.",
                expressions: [
                    {
                        id: "bear-with-me-main",
                        expression: "Bear with me",
                        whenToUse: "Use 'bear with me' to politely ask someone to wait or be patient while you complete a task, retrieve information, or resolve a minor issue. It's a common phrase in professional settings to manage expectations during a brief delay.",
                        situations: [
                            {
                                situation: "A. Retrieving Information",
                                example: "Bear with me while I pull up the latest report on the Q4 earnings.",
                                context: "You need a moment to find specific data during a call or meeting."
                            },
                            {
                                situation: "B. Technical Difficulty",
                                example: "Please bear with me, I'm having a slight technical issue with sharing my screen.",
                                context: "A minor tech problem is causing a delay in your presentation."
                            },
                            {
                                situation: "C. Switching Tasks",
                                example: "Bear with me, I'm just switching over to the project management tool.",
                                context: "You're transitioning between applications or documents during a collaborative session."
                            },
                            {
                                situation: "D. Unexpected Interruption",
                                example: "Bear with me for a moment, I just received an urgent message I need to glance at.",
                                context: "A sudden, brief distraction requires your immediate, but temporary, attention."
                            },
                            {
                                situation: "E. Processing a Request",
                                example: "I'm just processing your request now, bear with me for a few seconds.",
                                context: "You're actively working on something that will take a short amount of time."
                            },
                            {
                                situation: "F. Bear with me a moment",
                                example: "Bear with me a moment, I'm just confirming the details.",
                                context: "For very brief, immediate delays, often used when you're almost ready."
                            },
                            {
                                situation: "G. Bear with me a week",
                                example: "I'll need to look into this further; bear with me a week for a full update.",
                                context: "For longer, more significant delays where a resolution isn't immediate."
                            },
                            {
                                situation: "H. Bear with me and we are finding a solution",
                                example: "This is a complex issue, but bear with me and we are finding a solution.",
                                context: "Used when acknowledging a problem and assuring the other party that efforts are underway to resolve it."
                            }
                        ],
                        writingPrompt: "Write an email to a client explaining a minor delay in delivering a report, using the phrase 'bear with me' politely.",
                        practicePrompt: "Record yourself saying 'Bear with me while I pull up the latest report' in a calm and professional tone.",
                        bilingualMatches: [
                            { "english": "Bear with me", "portuguese": "Tenha paciência comigo / Aguarde um momento" },
                            { "english": "Pull up the report", "portuguese": "Puxar o relatório / Abrir o relatório" },
                            { "english": "Technical issue", "portuguese": "Problema técnico" },
                            { "english": "Sharing my screen", "portuguese": "Compartilhando minha tela" },
                            { "english": "Switching over", "portuguese": "Mudando para / Trocando para" },
                            { "english": "Urgent message", "portuguese": "Mensagem urgente" },
                            { "english": "Glance at", "portuguese": "Dar uma olhada rápida em" },
                            { "english": "Processing your request", "portuguese": "Processando sua solicitação" },
                            { "english": "A few seconds", "portuguese": "Alguns segundos" },
                            { "english": "Confirming the details", "portuguese": "Confirmando os detalhes" },
                            { "english": "Look into this further", "portuguese": "Investigar isso mais a fundo" },
                            { "english": "Full update", "portuguese": "Atualização completa" },
                            { "english": "Complex issue", "portuguese": "Problema complexo" },
                            { "english": "Finding a solution", "portuguese": "Encontrando uma solução" },
                            { "english": "Manage expectations", "portuguese": "Gerenciar expectativas" }
                        ],
                        reorderPrompt: {
                            instruction: "Reorder these words to form a correct sentence about asking for patience:",
                            items: [
                                { "id": "word1", "text": "me", "order": 2 },
                                { "id": "word2", "text": "Bear", "order": 1 },
                                { "id": "word3", "text": "while", "order": 3 },
                                { "id": "word4", "text": "I", "order": 4 },
                                { "id": "word5", "text": "check", "order": 5 },
                                { "id": "word6", "text": "that.", "order": 6 }
                            ]
                        },
                        fillInTheBlanks: [
                            {
                                sentence: "Please ______ with me while I retrieve the document.",
                                answer: "bear",
                                options: ["bear", "wait", "hold", "stay"]
                            },
                            {
                                sentence: "I'm having a slight technical issue, so please bear with me for a ______.",
                                answer: "moment",
                                options: ["minute", "second", "moment", "while"]
                            },
                            {
                                sentence: "We are actively working on a solution, so bear with me and we will ______ you soon.",
                                answer: "update",
                                options: ["tell", "inform", "update", "notify"]
                            }
                        ]
                    }
                ]
            };

            // Define the tabs with their content
            const tabs = [
                { id: 1, name: 'Intro', content: `
                    <div class="intro-content tab-content">
                        <h2 class="tab-title">Introduction <span class="emoji">👋</span></h2>
                        <p class="tab-description">Welcome to your 'Bear with me' lesson!</p>
                        <p class="intro-text">
                            This lesson will guide you through the nuances of using the phrase
                            "<span class="intro-highlight">${lessonData.expressions[0].expression}</span>"
                            in various professional contexts. It's designed to be ADHD-friendly,
                            breaking down complex ideas into manageable, engaging steps.
                        </p>
                        <p class="intro-text">
                            Click on the tabs above to explore different aspects of this expression.
                            Let's master the art of politely asking for a pause!
                        </p>
                        <div class="language-toggle">
                            <button class="language-button active">English</button>
                            <button class="language-button">Português</button>
                        </div>
                    </div>
                `},
                { id: 2, name: 'When to Use', content: `
                    <div class="when-to-use-content tab-content">
                        <h2 class="tab-title">When to Use <span class="emoji">🤔</span></h2>
                        <p class="tab-description">Understand the appropriate contexts for this expression.</p>
                        <p class="when-to-use-text">
                            ${lessonData.expressions[0].whenToUse}
                        </p>
                        <div class="pronunciation-block">
                            <button class="play-button">🔊 Play Sound</button>
                        </div>
                    </div>
                `},
                { id: 3, name: 'Situations', content: `
                    <div class="situations-content tab-content">
                        <h2 class="tab-title">Situations <span class="emoji">💡</span></h2>
                        <p class="tab-description">See real-world examples of the expression in use.</p>
                        <div class="situations-grid">
                            ${lessonData.expressions[0].situations.map(s => `
                                <div class="situation-card">
                                    <h3>${s.situation}</h3>
                                    <p>${s.example}</p>
                                    <p class="context">${s.context}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `},
                { id: 4, name: 'Write', content: `
                    <div class="write-content tab-content">
                        <h2 class="tab-title">Write <span class="emoji">✍️</span></h2>
                        <p class="tab-description">Practice by writing your own sentences.</p>
                        <p class="writing-prompt">${lessonData.expressions[0].writingPrompt}</p>
                        <textarea class="writing-textarea" placeholder="Start writing here..." maxlength="500"></textarea>
                        <div class="char-count">0 / 500 characters</div>
                    </div>
                `},
                { id: 5, name: 'Bilingual Match', content: `
                    <div class="tab-content">
                        <h2 class="tab-title">Bilingual Match <span class="emoji">↔️</span></h2>
                        <p class="tab-description">Match the English phrases with their Portuguese equivalents. (Static example)</p>
                        <div class="match-grid">
                            <div class="column english-column">
                                <h3>English</h3>
                                ${lessonData.expressions[0].bilingualMatches?.map(m => `<div class="match-card english-card">${m.english}</div>`).join('') || '<p>No matches</p>'}
                            </div>
                            <div class="column portuguese-column">
                                <h3>Português</h3>
                                ${lessonData.expressions[0].bilingualMatches?.map(m => `<div class="match-card portuguese-card">${m.portuguese}</div>`).join('') || '<p>No matches</p>'}
                            </div>
                        </div>
                    </div>
                `},
                { id: 6, name: 'Reorder Sequence', content: `
                    <div class="tab-content">
                        <h2 class="tab-title">Reorder Sequence <span class="emoji">🧩</span></h2>
                        <p class="tab-description">Arrange the words to form a correct sentence. (Static example)</p>
                        <div class="reorder-container">
                            <p class="writing-prompt">${lessonData.expressions[0].reorderPrompt?.instruction || 'No reorder prompt'}</p>
                            <div class="sentence-display">
                                ${lessonData.expressions[0].reorderPrompt?.items.map(() => `<div class="word-slot"></div>`).join('') || ''}
                            </div>
                            <div class="word-options">
                                ${lessonData.expressions[0].reorderPrompt?.items.map(item => `<div class="option-word">${item.text}</div>`).join('') || ''}
                            </div>
                        </div>
                    </div>
                `},
                { id: 7, name: 'Fill the Blanks', content: `
                    <div class="tab-content">
                        <h2 class="tab-title">Fill the Blanks <span class="emoji">📝</span></h2>
                        <p class="tab-description">Drag and drop words to complete the sentences. (Static example)</p>
                        <div class="fill-blanks-container">
                            ${lessonData.expressions[0].fillInTheBlanks?.map(fb => `
                                <div class="sentence-block">
                                    <p class="sentence-text">${fb.sentence.replace('______', '<div class="blank-box"></div>')}</p>
                                    <div class="options-container">
                                        ${fb.options.map(opt => `<div class="option-card">${opt}</div>`).join('')}
                                    </div>
                                </div>
                            `).join('') || '<p class="no-content-message">No fill-in-the-blanks exercises available.</p>'}
                        </div>
                    </div>
                `}
            ];

            let activeTab = 1; // Start with the first tab

            const tabNavigationElement = app.querySelector('.tab-navigation');
            const tabContentWrapper = app.querySelector('.tab-content-wrapper');
            const prevButton = app.querySelector('.lesson-footer .btn-secondary');
            const nextButton = app.querySelector('.lesson-footer .btn-primary');
            const totalTabs = tabs.length;

            // Function to render tab navigation buttons
            function renderTabNavigation() {
                if (tabNavigationElement) {
                    tabNavigationElement.innerHTML = tabs.map(tab => `
                        <button class="tab-item ${tab.id === activeTab ? 'active' : ''}" data-tab-id="${tab.id}">
                            <span class="tab-number">${tab.id}</span>
                            <span class="tab-title">${tab.name}</span>
                        </button>
                    `).join('');

                    // Add event listeners to newly rendered tab items
                    app.querySelectorAll('.tab-item').forEach(item => {
                        item.addEventListener('click', () => {
                            const tabId = parseInt(item.getAttribute('data-tab-id'));
                            activeTab = tabId;
                            renderTabContent(activeTab);
                            updateButtons();
                            renderTabNavigation(); // Re-render navigation to update active state
                        });
                    });
                }
            }

            // Function to render the content of the active tab
            function renderTabContent(tabId) {
                const tab = tabs.find(t => t.id === tabId);
                if (tab) {
                    tabContentWrapper.innerHTML = tab.content;
                    // Add event listener for the writing textarea if it exists
                    const writingTextarea = tabContentWrapper.querySelector('.writing-textarea');
                    if (writingTextarea) {
                        const charCountElement = tabContentWrapper.querySelector('.char-count');
                        const updateCharCount = () => {
                            const currentLength = writingTextarea.value.length;
                            const maxLength = writingTextarea.getAttribute('maxlength');
                            charCountElement.textContent = `${currentLength} / ${maxLength} characters`;
                        };
                        writingTextarea.addEventListener('input', updateCharCount);
                        updateCharCount(); // Initial count
                    }
                }
            }

            // Function to update the disabled state of navigation buttons
            function updateButtons() {
                prevButton.disabled = activeTab === 1;
                nextButton.disabled = activeTab === totalTabs;
            }

            // Event listeners for previous/next buttons
            prevButton.addEventListener('click', () => {
                if (activeTab > 1) {
                    activeTab--;
                    renderTabContent(activeTab);
                    updateButtons();
                    renderTabNavigation(); // Re-render navigation to update active state
                }
            });

            nextButton.addEventListener('click', () => {
                if (activeTab < totalTabs) {
                    activeTab++;
                    renderTabContent(activeTab);
                    updateButtons();
                    renderTabNavigation(); // Re-render navigation to update active state
                }
            });

            // Event listener for the "Play Sound" button (using event delegation)
            tabContentWrapper.addEventListener('click', (event) => {
                const target = event.target;
                if (target && target.classList.contains('play-button')) {
                    if (lessonData.expressions.length > 0 && 'speechSynthesis' in window) {
                        const utterance = new SpeechSynthesisUtterance(lessonData.expressions[0].expression);
                        utterance.lang = 'en-US';
                        speechSynthesis.speak(utterance);
                    }
                }
            });

            // Initial render calls
            renderTabNavigation();
            renderTabContent(activeTab);
            updateButtons();
        });
    </script>
</body>
